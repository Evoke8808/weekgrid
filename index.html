<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WeekGrid: plan your weekly time blocks and track what you actually did." />
  <meta name="theme-color" content="#000000" />
  <title>WeekGrid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="top-in">
      <h1 class="wordmark" aria-label="WeekGrid">
        <span>W</span><span>e</span><span>e</span><span>k</span><span>G</span><span>r</span><span>i</span><span>d</span>
      </h1>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-view="today" role="tab">Today</button>
        <button class="tab" data-view="week" role="tab">Week</button>
        <button class="tab" data-view="timetable" role="tab">Timetable</button>
        <button class="tab" data-view="settings" role="tab">Settings</button>
        <span class="tab-ink" aria-hidden="true"></span>
      </nav>
    </div>
  </header>

  <main>
    <section id="view-today" class="view active"></section>
    <section id="view-week" class="view"></section>
    <section id="view-timetable" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>

  <div id="fx" aria-hidden="true"></div>
  <div id="wipe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden />

  <script src="my-timetable.js"></script><!-- optional personal preset; safe to be missing -->
  <script src="app.js"></script>
</body>
</html>
